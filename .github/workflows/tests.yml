name: Offline checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra data --python 3.11
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run context-audit demo
      - run: uv run context-audit analyze
      - run: uv run python scripts/check_notebooks.py
      - run: uv run context-audit scan-public
