[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-monitor-context-audit"
version = "0.1.0"
description = "Retrospective paired evaluation of external agent monitors under context compression"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "anthropic>=0.66", "pydantic>=2.11", "numpy>=2.0", "pandas>=2.2",
  "scikit-learn>=1.6", "matplotlib>=3.9", "PyYAML>=6.0", "python-dotenv>=1.0", "httpx>=0.28",
]

[project.optional-dependencies]
data = ["cryptography>=45"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "jupyterlab>=4.3"]

[project.scripts]
context-audit = "context_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
